<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Pro 参数计算器</title>
<style>
  /* 全局字体与基础重置 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg-color: #0f172a;        /* 深蓝黑背景 */
    --card-bg: #1e293b;         /* 卡片背景 */
    --input-bg: #334155;        /* 输入框背景 */
    --text-main: #f8fafc;       /* 主文字 */
    --text-sub: #94a3b8;        /* 辅助文字 */
    --primary: #3b82f6;         /* 主色（蓝） */
    --primary-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6); /* 渐变蓝紫 */
    --success: #10b981;         /* 成功/结果色 */
  }
  
  body {
    margin: 0; padding: 20px 16px;
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at top right, #1e1b4b 0%, transparent 40%),
                      radial-gradient(circle at bottom left, #0f172a 0%, transparent 40%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  
  .app-container { max-width: 480px; margin: 0 auto; }
  
  /* 顶部标题区 */
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 24px; margin: 0 0 8px; font-weight: 700; letter-spacing: 0.5px; }
  .formula {
    display: inline-block; background: rgba(255, 255, 255, 0.1); 
    padding: 6px 16px; border-radius: 20px; 
    font-family: "SF Mono", Consolas, monospace; font-size: 13px; color: var(--text-sub);
    backdrop-filter: blur(10px);
  }
  
  /* 卡片通用样式 */
  .card {
    background: var(--card-bg); border-radius: 20px; padding: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05);
  }
  
  /* 输入网格 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .input-group { display: flex; flex-direction: column; }
  .input-group label {
    font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 500;
    padding-left: 4px;
  }
  .input-group input {
    padding: 14px; font-size: 16px; font-family: "SF Mono", Consolas, monospace;
    border: 2px solid transparent; border-radius: 12px;
    background: var(--input-bg); color: var(--text-main);
    outline: none; transition: all 0.3s ease;
  }
  .input-group input:focus {
    border-color: var(--primary); background: #1e293b;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }
  /* 隐藏数字输入框的上下箭头 */
  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  
  /* 计算按钮 */
  .btn-calc {
    width: 100%; padding: 16px; margin-top: 24px;
    background: var(--primary-gradient); color: #fff; 
    font-size: 18px; font-weight: bold; letter-spacing: 1px;
    border: none; border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    transition: all 0.2s ease;
  }
  .btn-calc:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(59, 130, 246, 0.6); }
  
  /* 结果展示区 */
  .result-box {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 20px; padding: 24px 20px; text-align: center;
    margin-bottom: 20px; display: none;
  }
  .result-box.show { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .result-title { color: #34d399; font-size: 14px; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .result-value { 
    color: #fff; font-size: 42px; font-weight: 800; 
    font-family: "SF Mono", Consolas, monospace; word-break: break-all;
    text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
  }
  
  /* 历史记录区 */
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .history-header h2 { font-size: 16px; margin: 0; color: var(--text-main); font-weight: 600; }
  .btn-clear {
    background: rgba(239, 68, 68, 0.1); border: none; color: #f87171; 
    font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    transition: 0.2s;
  }
  .btn-clear:active { background: rgba(239, 68, 68, 0.2); }
  
  .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
  /* 美化滚动条 */
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  
  .history-item {
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 14px 16px; border-radius: 12px;
    display: flex; justify-content: space-between; align-items: center;
    animation: fadeIn 0.3s ease;
  }
  .history-item .time { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
  .history-item .val { font-weight: 600; color: #e2e8f0; font-family: "SF Mono", Consolas, monospace; font-size: 16px; }
  .empty-tip { text-align: center; color: var(--text-sub); font-size: 14px; padding: 20px 0; }
  
  /* 动画 */
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>参数计算器</h1>
    <div class="formula">C = (A×α + B×β - G) × K + G</div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="input-group"><label>A =</label><input type="number" inputmode="decimal" step="any" id="A" placeholder="0.00"></div>
      <div class="input-group"><label>G =</label><input type="number" inputmode="decimal" step="any" id="G" placeholder="0.00"></div>
      <div class="input-group"><label>B =</label><input type="number" inputmode="decimal" step="any" id="B" placeholder="0.00"></div>
      <div class="input-group"><label>α =</label><input type="number" inputmode="decimal" step="any" id="alpha" placeholder="0.00"></div>
      <div class="input-group"><label>β =</label><input type="number" inputmode="decimal" step="any" id="beta" placeholder="0.00"></div>
      <div class="input-group"><label>K =</label><input type="number" inputmode="decimal" step="any" id="K" placeholder="0.00"></div>
    </div>
    <button class="btn-calc" id="calcBtn">开始计算</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-title">计算结果 C</div>
    <div class="result-value" id="resultValue">0</div>
  </div>

  <div class="card">
    <div class="history-header">
      <h2>历史记录</h2>
      <button class="btn-clear" id="clearBtn">清空记录</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-tip">暂无计算记录</div>
    </div>
  </div>
</div>

<script>
  const ids = ['A', 'G', 'B', 'alpha', 'beta', 'K'];
  const STORAGE_KEY = 'calc_history_pro';

  // 数字格式化
  function fmt(n) {
    if (!isFinite(n)) return '错误';
    // 保留最多 8 位小数，去除末尾多余的 0
    return parseFloat(n.toFixed(8)).toString();
  }

  // 获取本地记录
  function getHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } 
    catch { return []; }
  }

  // 渲染列表
  function renderHistory() {
    const list = getHistory();
    const listEl = document.getElementById('historyList');
    if (list.length === 0) {
      listEl.innerHTML = '<div class="empty-tip">暂无计算记录</div>';
      return;
    }
    listEl.innerHTML = list.map(item => `
      <div class="history-item">
        <div>
          <div class="val">C = ${item.C}</div>
          <div class="time">${item.time}</div>
        </div>
      </div>
    `).join('');
  }

  // 核心计算事件
  document.getElementById('calcBtn').addEventListener('click', () => {
    const v = {};
    for (let id of ids) {
      const raw = document.getElementById(id).value.trim();
      v[id] = raw === '' ? 0 : Number(raw); // 防呆：空值当0处理
    }

    // 公式计算
    const C = (v.A * v.alpha + v.B * v.beta - v.G) * v.K + v.G;
    const resultStr = fmt(C);

    // 结果上屏
    const resultBox = document.getElementById('resultBox');
    document.getElementById('resultValue').textContent = resultStr;
    
    // 重置动画让它每次点击都有反馈
    resultBox.classList.remove('show');
    void resultBox.offsetWidth; // 触发重绘
    resultBox.classList.add('show');

    // 写入历史
    const now = new Date();
    const time = now.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    const history = getHistory();
    history.unshift({ time, C: resultStr });
    
    if (history.length > 20) history.pop(); // 限制20条
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    
    renderHistory();
  });

  // 清空记录
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('确定要清空所有历史记录吗？')) {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
      document.getElementById('resultBox').classList.remove('show');
    }
  });

  // 初始化
  renderHistory();
</script>
</body>
</html>
